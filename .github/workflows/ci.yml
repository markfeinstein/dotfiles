name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Scan reachable history
        run: >-
          nix shell --inputs-from . nixpkgs#gitleaks --command
          gitleaks git --config .gitleaks.toml --redact .

  nix:
    name: Nix checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Evaluate all systems and profiles
        run: nix flake check --all-systems --no-build --show-trace
      - name: Check Nix formatting
        run: nix fmt -- --check .

  lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Lint workflow
        run: nix shell --inputs-from . nixpkgs#actionlint --command actionlint
      - name: Lint shell scripts
        run: |
          nix shell --inputs-from . nixpkgs#shellcheck --command shellcheck \
            bin/bootstrap \
            bin/configure-repository-worktrees \
            bin/git-project \
            bin/lib/profile.sh \
            bin/lib/worktrees.sh \
            bin/rebuild \
            bin/rex/label-window \
            bin/rex/lazygit \
            nix/modules/darwin/scripts/install-yabai-app
